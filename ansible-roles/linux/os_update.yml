---
- name: Linux OS Update v2

  hosts: "{{ target_hosts | default('localhost') | split(';') | select('match', '.+') | join(':') }}"

  become: true
  gather_facts: true

  vars:
    ansible_remote_tmp: "/tmp/ansible_tmp"

    # Jenkins workspace
    os_update_report_directory: "{{ lookup('env', 'WORKSPACE') }}/reports"

  roles:
    - role: "{{ playbook_dir }}/os_update"

- name: Update last patch date
  ansible.builtin.copy:
    content: "{{ lookup('pipe', 'date +%Y-%m-%d') }}\n"
    dest: /etc/lastpatchdate
    owner: root
    group: root
    mode: '0644'
