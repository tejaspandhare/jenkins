---
# ============================================================
# OS UPDATE - REPORT GENERATION
# ============================================================
#
# Reports are generated on the Jenkins controller/agent,
# NOT on the target Linux server.
#
# The report directory is supplied by the playbook/Jenkins:
#
#   os_update_report_directory
#
# Example:
#
#   /var/lib/jenkins/workspace/<job>/reports
#
# ============================================================


# ============================================================
# 1. VALIDATE REPORT DIRECTORY
# ============================================================

- name: OS Update | Validate report directory variable
  ansible.builtin.assert:
    that:
      - os_update_report_directory is defined
      - os_update_report_directory | trim | length > 0
    fail_msg: >-
      os_update_report_directory is not configured.
      Please provide the Jenkins workspace reports directory.


# ============================================================
# 2. CREATE REPORT DIRECTORY
# ============================================================

- name: OS Update | Create report directory
  ansible.builtin.file:
    path: "{{ os_update_report_directory }}"
    state: directory
    mode: "0755"
  delegate_to: localhost
  become: false


# ============================================================
# 3. GENERATE HTML REPORT
# ============================================================

- name: OS Update | Generate HTML report
  ansible.builtin.template:
    src: report.j2
    dest: "{{ os_update_report_directory }}/{{ inventory_hostname }}.html"
    mode: "0644"
  delegate_to: localhost
  become: false


# ============================================================
# 4. VERIFY REPORT
# ============================================================

- name: OS Update | Verify HTML report
  ansible.builtin.stat:
    path: "{{ os_update_report_directory }}/{{ inventory_hostname }}.html"
  register: os_update_report_file
  delegate_to: localhost
  become: false


# ============================================================
# 5. REPORT GENERATION STATUS
# ============================================================

- name: OS Update | Validate generated report
  ansible.builtin.assert:
    that:
      - os_update_report_file.stat.exists
      - os_update_report_file.stat.size | int > 0
    fail_msg: >-
      HTML report was not generated correctly.

      Expected:
      {{ os_update_report_directory }}/{{ inventory_hostname }}.html

    success_msg: >-
      HTML report generated successfully:

      {{ os_update_report_directory }}/{{ inventory_hostname }}.html
  delegate_to: localhost
  become: false


# ============================================================
# 6. DISPLAY REPORT LOCATION
# ============================================================

- name: OS Update | Display report location
  ansible.builtin.debug:
    msg:
      - "============================================================"
      - "OS UPDATE REPORT"
      - "============================================================"
      - "Host          : {{ inventory_hostname }}"
      - "Report        : {{ os_update_report_directory }}/{{ inventory_hostname }}.html"
      - "Report status : GENERATED"
      - "============================================================"
