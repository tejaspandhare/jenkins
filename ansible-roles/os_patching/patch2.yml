---
# -----------------------------------------------------------------
# PLAY 1: DYNAMIC INVENTORY SETUP
# -----------------------------------------------------------------
- name: Parse and Map Dynamic Target Scope
  hosts: localhost
  gather_facts: false
  vars:
    target_hosts: ""
  tasks:
    - name: Dynamically append target nodes to runtime environment
      ansible.builtin.add_host:
        name: "{{ item.strip() }}"
        groups: patching_execution_group
      loop: "{{ target_hosts.split(';') }}"
      when: target_hosts.strip() != ""

# -----------------------------------------------------------------
# PLAY 2: ENTERPRISE PATCHING ENGINE & TELEMETRY GENERATION
# -----------------------------------------------------------------
- name: Enterprise Linux Patching and Reporting
  hosts: patching_execution_group
  gather_facts: true
  vars:
    ansible_remote_tmp: "/tmp/ansible_tmp"
    EXCLUDE_PKGS: ""

  roles:
    - precheck
    - patch     
    - reboot
    - postcheck

  tasks:
    # ----------------------------------------------------------
    # PRECISION LOG MARKER - RUNS BEFORE PATCHING LIFE CYCLE
    # ----------------------------------------------------------
    - name: Establish precision pre-patch log tracking boundary
      when: ansible_os_family == "Debian"
      become: true
      ansible.builtin.file:
        path: /tmp/.patch_window_start
        state: touch
        mode: '0644'

    # ----------------------------------------------------------
    # DEBIAN/UBUNTU TARGETED SYSTEM UPGRADE LIFE CYCLE
    # ----------------------------------------------------------
    - name: Update apt cache index
      when: ansible_os_family == "Debian"
      become: true
      ansible.builtin.apt:
        update_cache: true

    - name: Mark package exclusions to prevent upgrading (Debian/Ubuntu)
      when: ansible_os_family == "Debian" and EXCLUDE_PKGS.strip() != ""
      become: true
      ansible.builtin.dpkg_selections:
        name: "{{ item.strip() }}"
        selection: hold
      loop: "{{ EXCLUDE_PKGS.split(';') }}"
      ignore_errors: true

    - name: Force full system upgrade bypassing phased-update delays (Debian/Ubuntu)
      when: ansible_os_family == "Debian"
      become: true
      ansible.builtin.apt:
        upgrade: dist
        force_apt_get: true
        dpkg_options: "Dpkg::Options::=--force-confold"
      environment:
        APT_LISTBUGS_FRONTEND: "none"
      register: apt_upgrade_result

    - name: Unhold package exclusions to restore normal system operations (Debian/Ubuntu)
      when: ansible_os_family == "Debian" and EXCLUDE_PKGS.strip() != ""
      become: true
      ansible.builtin.dpkg_selections:
        name: "{{ item.strip() }}"
        selection: install
      loop: "{{ EXCLUDE_PKGS.split(';') }}"
      ignore_errors: true

    - name: Fallback force upgrade remaining phased/held-back utilities (Debian/Ubuntu)
      when: ansible_os_family == "Debian"
      become: true
      ansible.builtin.shell: |
        export DEBIAN_FRONTEND=noninteractive
        apt-get install -y -o Dpkg::Options::="--force-confold" -o APT::Get::Always-Include-Phased-Updates=True libopeniscsiusr open-iscsi tmux ubuntu-pro-client ubuntu-pro-client-l10n ubuntu-advantage-tools
      ignore_errors: true

    # ----------------------------------------------------------
    # REDHAT/CENTOS TARGETED SYSTEM UPGRADE LIFE CYCLE
    # ----------------------------------------------------------
    - name: Force apply outstanding upgradable items with exclusions (RedHat/CentOS)
      when: ansible_os_family == "RedHat"
      become: true
      ansible.builtin.dnf:
        name: "*"
        state: latest
        only_upgrade: true
        exclude: "{{ EXCLUDE_PKGS.split(';') if EXCLUDE_PKGS.strip() != '' else omit }}"
      ignore_errors: true

    # ----------------------------------------------------------
    # HARVEST REAL-TIME COMPLIANCE CHANGES VIA SNAPSHOT DELTAS
    # ----------------------------------------------------------
    - name: Parse packages updated strictly during this execution window (Debian/Ubuntu)
      when: ansible_os_family == "Debian"
      become: true
      # Extracted records modified strictly after our runtime marker file
      ansible.builtin.shell: |
        find /var/log/dpkg.log -newer /tmp/.patch_window_start -exec grep -E " (status|trigproc|install) " {} + | awk '{print $4, $5, $6}' || true
      register: live_updates_debian
      changed_when: false

    - name: Parse packages updated during this execution window (RedHat/CentOS)
      when: ansible_os_family == "RedHat"
      become: true
      ansible.builtin.shell: |
        dnf history info $(dnf history list -q | head -n 1 | awk '{print $1}') | grep -E '^(Alter|Install|Upgrade)' | awk '{print $1, "Installed", $2}' || true
      register: live_updates_redhat
      changed_when: false

    - name: Clean up temporary execution tracking markers
      when: ansible_os_family == "Debian"
      become: true
      ansible.builtin.file:
        path: /tmp/.patch_window_start
        state: absent
      ignore_errors: true

    # ----------------------------------------------------------
    # UPDATE SYSTEM LAST PATCH FILE TARGET METRICS
    # ----------------------------------------------------------
    - name: Get current date from target host
      ansible.builtin.command:
        cmd: date +%Y-%m-%d
      register: current_patch_date
      changed_when: false

    - name: Update last patch date
      become: true
      ansible.builtin.copy:
        content: "{{ current_patch_date.stdout | trim }}\n"
        dest: /etc/lastpatchdate
        owner: root
        group: root
        mode: '0600'

    # ----------------------------------------------------------
    # CONSOLIDATED TELEMETRY GENERATION ENGINE (FIXED TELEMETRY)
    # ----------------------------------------------------------
    - name: Display Structured Telemetry Stream
      run_once: true
      delegate_to: localhost
      ansible.builtin.debug:
        msg: |
          REPORT_DATA_START
          {% for host in groups['patching_execution_group'] | default([]) %}
          HOST_RECORD:{{ host }}
          OS:{{ hostvars[host]['ansible_distribution'] | default('Unknown') }} {{ hostvars[host]['ansible_distribution_version'] | default('') }}
          {% set h = hostvars[host]['patch_result'] | default({}) %}
          OLD_KERNEL:{{ h.old_kernel | default('N/A') }}
          NEW_KERNEL:{{ h.new_kernel | default('N/A') }}
          UPDATED:{{ 'Yes' if (hostvars[host]['apt_upgrade_result'] is changed or (hostvars[host]['live_updates_debian']['stdout_lines'] | default([]) | length > 0) or (hostvars[host]['live_updates_redhat']['stdout_lines'] | default([]) | length > 0)) else 'No' }}
          REBOOT:{{ h.reboot | default('No') }}
          STATUS:{{ h.status | default('SUCCESS') }}
          PATCHED_PACKAGES_START
          {% if hostvars[host]['live_updates_debian']['stdout_lines'] is defined and hostvars[host]['live_updates_debian']['stdout_lines'] | length > 0 %}
          {% for line in hostvars[host]['live_updates_debian']['stdout_lines'] %}
          {{ line }}
          {% endfor %}
          {% elif hostvars[host]['live_updates_redhat']['stdout_lines'] is defined and hostvars[host]['live_updates_redhat']['stdout_lines'] | length > 0 %}
          {% for line in hostvars[host]['live_updates_redhat']['stdout_lines'] %}
          {{ line }}
          {% endfor %}
          {% endif %}
          PATCHED_PACKAGES_END
          HOST_RECORD_END
          {% endfor %}
          REPORT_DATA_END
