---
# -----------------------------------------------------------------
# PLAY 1: DYNAMIC INVENTORY SETUP
# -----------------------------------------------------------------
- name: Parse and Map Dynamic Target Scope
  hosts: localhost
  gather_facts: false
  vars:
    target_hosts: ""
  tasks:
    - name: Dynamically append target nodes to runtime environment
      ansible.builtin.add_host:
        name: "{{ item.strip() }}"
        groups: patching_execution_group
      loop: "{{ target_hosts.split(';') }}"
      when: target_hosts.strip() != ""
      loop_control:
        label: "{{ item.strip() }}"

# -----------------------------------------------------------------
# PLAY 2: ENTERPRISE PATCHING ENGINE & TELEMETRY GENERATION
# -----------------------------------------------------------------
- name: Enterprise Linux Patching and Reporting
  hosts: patching_execution_group
  gather_facts: true
  vars:
    ansible_remote_tmp: "/tmp/ansible_tmp"
    EXCLUDE_PKGS: ""

  tasks:
    # ----------------------------------------------------------
    # CRITICAL BASELINE SNAPSHOT - MUST RUN FIRST
    # ----------------------------------------------------------
    - name: Record True Baseline Kernel Version
      ansible.builtin.set_fact:
        baseline_kernel: "{{ ansible_kernel }}"

    # ----------------------------------------------------------
    # ROLE INCLUSION Lifecycle Execution Order
    # ----------------------------------------------------------
    - name: Execute Precheck Suite
      ansible.builtin.include_role:
        name: precheck

    # ----------------------------------------------------------
    # PRECISION LOG MARKER - RUNS BEFORE PATCHING LIFE CYCLE
    # ----------------------------------------------------------
    - name: Establish precision pre-patch log tracking boundary
      when: ansible_os_family == "Debian"
      become: true
      ansible.builtin.file:
        path: /tmp/.patch_window_start
        state: touch
        mode: '0644'

    - name: Execute Core Patch Role
      ansible.builtin.include_role:
        name: patch

    # ----------------------------------------------------------
    # DEBIAN/UBUNTU TARGETED SYSTEM UPGRADE LIFE CYCLE
    # ----------------------------------------------------------
    - name: Update apt cache index
      when: ansible_os_family == "Debian"
      become: true
      ansible.builtin.apt:
        update_cache: true

    - name: Mark package exclusions to prevent upgrading (Debian/Ubuntu)
      when: ansible_os_family == "Debian" and EXCLUDE_PKGS.strip() != ""
      become: true
      ansible.builtin.dpkg_selections:
        name: "{{ item.strip() }}"
        selection: hold
      loop: "{{ EXCLUDE_PKGS.split(';') }}"
      loop_control:
        label: "{{ item.strip() }}"
      ignore_errors: true

    - name: Force full system upgrade bypassing phased-update delays (Debian/Ubuntu)
      when: ansible_os_family == "Debian"
      become: true
      ansible.builtin.apt:
        upgrade: dist
        force_apt_get: true
        dpkg_options: "Dpkg::Options::=--force-confold"
      environment:
        APT_LISTBUGS_FRONTEND: "none"
      register: apt_upgrade_result
      no_log: true

    - name: Unhold package exclusions to restore normal system operations (Debian/Ubuntu)
      when: ansible_os_family == "Debian" and EXCLUDE_PKGS.strip() != ""
      become: true
      ansible.builtin.dpkg_selections:
        name: "{{ item.strip() }}"
        selection: install
      loop: "{{ EXCLUDE_PKGS.split(';') }}"
      loop_control:
        label: "{{ item.strip() }}"
      ignore_errors: true

    - name: Fallback force upgrade remaining phased/held-back utilities (Debian/Ubuntu)
      when: ansible_os_family == "Debian"
      become: true
      ansible.builtin.shell: |
        export DEBIAN_FRONTEND=noninteractive
        apt-get install -y -o Dpkg::Options::="--force-confold" -o APT::Get::Always-Include-Phased-Updates=True libopeniscsiusr open-iscsi tmux ubuntu-pro-client ubuntu-pro-client-l10n ubuntu-advantage-tools
      register: fallback_upgrade_result
      ignore_errors: true
      no_log: true

    # ----------------------------------------------------------
    # REDHAT/CENTOS TARGETED SYSTEM UPGRADE LIFE CYCLE
    # ----------------------------------------------------------
    - name: Force apply outstanding upgradable items with exclusions (RedHat/CentOS)
      when: ansible_os_family == "RedHat"
      become: true
      ansible.builtin.dnf:
        name: "*"
        state: latest
        only_upgrade: true
        exclude: "{{ EXCLUDE_PKGS.split(';') if EXCLUDE_PKGS.strip() != '' else omit }}"
      register: dnf_upgrade_result
      ignore_errors: true
      no_log: true

    # ----------------------------------------------------------
    # HARVEST REAL-TIME COMPLIANCE CHANGES VIA SNAPSHOT DELTAS
    # ----------------------------------------------------------
    - name: Parse packages updated strictly during this execution window (Debian/Ubuntu)
      when: ansible_os_family == "Debian"
      become: true
      ansible.builtin.shell: |
        find /var/log/dpkg.log -newer /tmp/.patch_window_start -exec grep -E " (unpacked|installed) " {} + | awk '{print $4, $5, $6}' | sort -u || true
      register: live_updates_debian
      changed_when: false

    - name: Parse packages updated during this execution window (RedHat/CentOS)
      when: ansible_os_family == "RedHat"
      become: true
      ansible.builtin.shell: |
        dnf history info $(dnf history list -q | head -n 1 | awk '{print $1}') | grep -E '^(Alter|Install|Upgrade)' | awk '{print $2, $3, $4}' || true
      register: live_updates_redhat
      changed_when: false

    - name: Clean up temporary execution tracking markers
      when: ansible_os_family == "Debian"
      become: true
      ansible.builtin.file:
        path: /tmp/.patch_window_start
        state: absent
      ignore_errors: true

    # ----------------------------------------------------------
    # EVALUATE SYSTEM REBOOT STATE
    # ----------------------------------------------------------
    - name: Determine if Debian/Ubuntu requires reboot
      when: ansible_os_family == "Debian"
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: debian_reboot_marker

    - name: Set dynamic reboot track flag
      ansible.builtin.set_fact:
        needs_reboot: "{{ true if (debian_reboot_marker.stat is defined and debian_reboot_marker.stat.exists) else false }}"

    - name: Execute Reboot Suite
      ansible.builtin.include_role:
        name: reboot

    - name: Execute Postcheck Suite
      ansible.builtin.include_role:
        name: postcheck

    # ----------------------------------------------------------
    # FORCE FACT REFRESH TO CAPTURE POST-UPGRADE PACKAGE METRICS
    # ----------------------------------------------------------
    - name: Force collect current system status from underlying disk architecture
      ansible.builtin.setup:
        gather_subset:
          - '!all'
          - 'min'

    # ----------------------------------------------------------
    # UPDATE SYSTEM LAST PATCH FILE TARGET METRICS
    # ----------------------------------------------------------
    - name: Get current date from target host
      ansible.builtin.command:
        cmd: date +%Y-%m-%d
      register: current_patch_date
      changed_when: false

    - name: Update last patch date
      become: true
      ansible.builtin.copy:
        content: "{{ current_patch_date.stdout | trim }}\n"
        dest: /etc/lastpatchdate
        owner: root
        group: root
        mode: '0600'

    # ----------------------------------------------------------
    # NATIVE JINJA2 DASHBOARD RENDERING ENGINE (SILENT GENERATION)
    # ----------------------------------------------------------
    - name: Compile and Render Elegant HTML Patch Dashboard Natively
      run_once: true
      delegate_to: localhost
      changed_when: false
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../../templates/patch_report.html.j2"
        dest: "/tmp/patch_report.html"
