---
# -----------------------------------------------------------------
# PLAY 1: DYNAMIC INVENTORY SETUP
# -----------------------------------------------------------------
- name: Parse and Map Dynamic Target Scope
  hosts: localhost
  gather_facts: false
  vars:
    target_hosts: ""
  tasks:
    - name: Dynamically append target nodes to runtime environment
      ansible.builtin.add_host:
        name: "{{ item.strip() }}"
        groups: patching_execution_group
      loop: "{{ target_hosts.split(';') }}"
      when: target_hosts.strip() != ""

# -----------------------------------------------------------------
# PLAY 2: ENTERPRISE PATCHING ENGINE & TELEMETRY GENERATION
# -----------------------------------------------------------------
- name: Enterprise Linux Patching and Reporting
  hosts: patching_execution_group
  gather_facts: true
  vars:
    ansible_remote_tmp: "/tmp/ansible_tmp"

  roles:
    - precheck
    - patch     
    - reboot
    - postcheck

  tasks:
    # ----------------------------------------------------------
    # PRODUCTION FAIL-SAFE: FORCE RESOLVE HELD-BACK PACKAGES
    # ----------------------------------------------------------
    - name: Force resolve and upgrade held back iscsi packages (Debian/Ubuntu)
      when: ansible_os_family == "Debian"
      become: true
      ansible.builtin.shell: |
        export DEBIAN_FRONTEND=noninteractive
        apt-get update -qq
        apt-get install -y -o Dpkg::Options::="--force-confold" libopeniscsiusr open-iscsi
      ignore_errors: true

    - name: Force apply outstanding upgradable items (RedHat/CentOS)
      when: ansible_os_family == "RedHat"
      become: true
      ansible.builtin.dnf:
        name: "*"
        state: latest
        only_upgrade: true
      ignore_errors: true

    # ----------------------------------------------------------
    # FIX: Extract historical updates from the package log files
    # ----------------------------------------------------------
    - name: Parse packages updated during this execution window (Debian/Ubuntu)
      when: ansible_os_family == "Debian"
      become: true
      ansible.builtin.shell: |
        # Pulls only packages installed or upgraded during the current hour to avoid historical overlaps
        grep -E "$(date +'%Y-%m-%d %H:').*inst" /var/log/dpkg.log | awk '{print $4, $5, $6}' || true
      register: live_updates_debian
      changed_when: false

    - name: Parse packages updated during this execution window (RedHat/CentOS)
      when: ansible_os_family == "RedHat"
      become: true
      ansible.builtin.shell: |
        dnf history info $(dnf history list -q | head -n 1 | awk '{print $1}') | grep -E '^(Alter|Install|Upgrade)' | awk '{print $1, "Installed", $2}' || true
      register: live_updates_redhat
      changed_when: false

    # ----------------------------------------------------------
    # Update last patch date on the TARGET HOST
    # ----------------------------------------------------------
    - name: Get current date from target host
      ansible.builtin.command:
        cmd: date +%Y-%m-%d
      register: current_patch_date
      changed_when: false

    - name: Update last patch date
      become: true
      ansible.builtin.copy:
        content: "{{ current_patch_date.stdout | trim }}\n"
        dest: /etc/lastpatchdate
        owner: root
        group: root
        mode: '0600'

    # ----------------------------------------------------------
    # CONSOLIDATED TELEMETRY GENERATION ENGINE
    # ----------------------------------------------------------
    - name: Display Structured Telemetry Stream
      run_once: true
      delegate_to: localhost
      ansible.builtin.debug:
        msg: |
          REPORT_DATA_START
          {% for host in groups['patching_execution_group'] | default([]) %}
          HOST_RECORD:{{ host }}
          OS:{{ hostvars[host]['ansible_distribution'] | default('Unknown') }} {{ hostvars[host]['ansible_distribution_version'] | default('') }}
          {% set h = hostvars[host]['patch_result'] | default({}) %}
          OLD_KERNEL:{{ h.old_kernel | default('N/A') }}
          NEW_KERNEL:{{ h.new_kernel | default('N/A') }}
          UPDATED:{{ h.updated | default('No') }}
          REBOOT:{{ h.reboot | default('No') }}
          STATUS:{{ h.status | default('FAILED') }}
          PATCHED_PACKAGES_START
          {% if hostvars[host]['live_updates_debian'] is defined and hostvars[host]['live_updates_debian'] is mapping and 'stdout_lines' in hostvars[host]['live_updates_debian'] and hostvars[host]['live_updates_debian']['stdout_lines'] | length > 0 %}
          {% for line in hostvars[host]['live_updates_debian']['stdout_lines'] %}
          {{ line }}
          {% endfor %}
          {% elif hostvars[host]['live_updates_redhat'] is defined and hostvars[host]['live_updates_redhat'] is mapping and 'stdout_lines' in hostvars[host]['live_updates_redhat'] and hostvars[host]['live_updates_redhat']['stdout_lines'] | length > 0 %}
          {% for line in hostvars[host]['live_updates_redhat']['stdout_lines'] %}
          {{ line }}
          {% endfor %}
          {% else %}
          No packages updated.
          {% endif %}
          PATCHED_PACKAGES_END
          HOST_RECORD_END
          {% endfor %}
          REPORT_DATA_END
