---
# ==========================================================
# PLAY 1: DYNAMIC INVENTORY SETUP
# ==========================================================
- name: Parse and Map Dynamic Target Scope
  hosts: localhost
  gather_facts: false
  vars:
    target_hosts: ""
  tasks:
    - name: Append target nodes to execution context
      ansible.builtin.add_host:
        name: "{{ item.strip() }}"
        groups: patching_execution_group
      loop: "{{ target_hosts.split(';') }}"
      when: target_hosts.strip() != ""
      loop_control:
        label: "{{ item.strip() }}"

# ==========================================================
# PLAY 2: ENTERPRISE PATCHING ENGINE & TELEMETRY
# ==========================================================
- name: Enterprise Linux Patching and Reporting
  hosts: patching_execution_group
  gather_facts: true
  vars:
    ansible_remote_tmp: "/tmp/ansible_tmp"
    EXCLUDE_PKGS: ""

  tasks:
    # 1. ESTABLISH BOUNDARY AT THE ABSOLUTE START OF THE EXECUTION
    - name: Establish precision pre-patch log boundary
      when: ansible_os_family == "Debian"
      become: true
      ansible.builtin.file:
        path: /tmp/.patch_window_start
        state: touch
        mode: '0644'

    - name: Record True Baseline Kernel Version
      ansible.builtin.set_fact:
        baseline_kernel: "{{ ansible_kernel }}"

    - name: Execute Precheck Suite
      ansible.builtin.include_role:
        name: precheck

    - name: Execute Core Patch Role
      ansible.builtin.include_role:
        name: patch

    - name: Update apt cache index
      when: ansible_os_family == "Debian"
      become: true
      ansible.builtin.apt:
        update_cache: true

    - name: Mark package exclusions (Debian/Ubuntu)
      when: ansible_os_family == "Debian" and EXCLUDE_PKGS.strip() != ""
      become: true
      ansible.builtin.dpkg_selections:
        name: "{{ item.strip() }}"
        selection: hold
      loop: "{{ EXCLUDE_PKGS.split(';') }}"
      loop_control:
        label: "{{ item.strip() }}"
      ignore_errors: true

    - name: Execute Core System Upgrade Loop
      when: ansible_os_family == "Debian"
      block:
        - name: Force full system upgrade (Debian/Ubuntu)
          become: true
          ansible.builtin.apt:
            upgrade: dist
            force_apt_get: true
            dpkg_options: "Dpkg::Options::=--force-confold"
          environment:
            APT_LISTBUGS_FRONTEND: "none"
          register: apt_upgrade_result
      rescue:
        - name: Handle mid-upgrade out-of-space crashes
          become: true
          block:
            - name: Kill stuck package manager processes
              ansible.builtin.shell: |
                pidof apt apt-get dpkg | xargs kill -9 2>/dev/null || true
              changed_when: false

            - name: Erase stale locks to unlock the frontend
              ansible.builtin.file:
                path: "{{ item }}"
                state: absent
              loop:
                - /var/lib/dpkg/lock
                - /var/lib/dpkg/lock-frontend

            - name: Free boot space by clearing oldest files
              ansible.builtin.shell: |
                all_vers=$(dpkg-query -W -f='${Package}\n' 'linux-image-[0-9]*' 2>/dev/null | sed -E 's/linux-image-unsigned-//g' | sed -E 's/linux-image-//g' | sort -V | uniq)
                running_ver=$(uname -r | sed 's/-generic//g')
                prev_ver=$(echo "$all_vers" | grep -B 1 -F "$running_ver" | head -n 1)
                find /boot -type f \( -name "*initrd*" -o -name "*vmlinuz*" -o -name "*System.map*" -o -name "*config*" \) \
                    ! -name "*$running_ver*" \
                    ! -name "*$prev_ver*" \
                    -delete || true
              changed_when: true

            - name: Re-run low-level configuration recovery
              ansible.builtin.command: dpkg --configure -a

            - name: Complete the system upgrade transaction
              ansible.builtin.apt:
                upgrade: dist
                force_apt_get: true
                dpkg_options: "Dpkg::Options::=--force-confold"
              register: apt_upgrade_result

    - name: Unhold package exclusions (Debian/Ubuntu)
      when: ansible_os_family == "Debian" and EXCLUDE_PKGS.strip() != ""
      become: true
      ansible.builtin.dpkg_selections:
        name: "{{ item.strip() }}"
        selection: install
      loop: "{{ EXCLUDE_PKGS.split(';') }}"
      loop_control:
        label: "{{ item.strip() }}"
      ignore_errors: true

    - name: Fallback force upgrade remaining utilities
      when: ansible_os_family == "Debian"
      become: true
      ansible.builtin.shell: |
        export DEBIAN_FRONTEND=noninteractive
        apt-get install -y -o Dpkg::Options::="--force-confold" -o APT::Get::Always-Include-Phased-Updates=True libopeniscsiusr open-iscsi tmux ubuntu-pro-client ubuntu-pro-client-l10n ubuntu-advantage-tools
      register: fallback_upgrade_result
      ignore_errors: true
      no_log: false

    - name: Force apply outstanding items (RedHat/CentOS)
      when: ansible_os_family == "RedHat"
      become: true
      ansible.builtin.dnf:
        name: "*"
        state: latest
        only_upgrade: true
        exclude: "{{ EXCLUDE_PKGS.split(';') if EXCLUDE_PKGS.strip() != '' else omit }}"
      register: dnf_upgrade_result
      ignore_errors: true
      no_log: true

    - name: Parse delta updates (Debian/Ubuntu)
      when: ansible_os_family == "Debian"
      become: true
      # FILTERED OUT 'linux-' TO PREVENT PRECHECK CLEANUP DUMPS FROM DILUTING LOG ENTRIES
      ansible.builtin.shell: |
        find /var/log/dpkg.log -newer /tmp/.patch_window_start -exec grep -E " status installed " {} + | grep -v " linux-" | awk '{print $5, $6}' | sort -u || true
      register: live_updates_debian
      changed_when: false

    - name: Parse delta updates (RedHat/CentOS)
      when: ansible_os_family == "RedHat"
      become: true
      ansible.builtin.shell: |
        dnf history info $(dnf history list -q | head -n 1 | awk '{print $1}') | grep -E '^(Upgrade|Install)' | awk '{print $2, $4}' || true
      register: live_updates_redhat
      changed_when: false

    - name: Clean up temporary tracking markers
      when: ansible_os_family == "Debian"
      become: true
      ansible.builtin.file:
        path: /tmp/.patch_window_start
        state: absent
      ignore_errors: true

    - name: Determine if Debian/Ubuntu requires reboot
      when: ansible_os_family == "Debian"
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: debian_reboot_marker

    - name: Set dynamic reboot track flag
      ansible.builtin.set_fact:
        needs_reboot: "{{ true if (debian_reboot_marker.stat is defined and debian_reboot_marker.stat.exists) else false }}"

    - name: Execute Reboot Suite
      ansible.builtin.include_role:
        name: reboot

    - name: Execute Postcheck Suite
      ansible.builtin.include_role:
        name: postcheck

    - name: Force collect post-upgrade metrics
      ansible.builtin.setup:
        gather_subset:
          - '!all'
          - 'min'

    - name: Get current date from target host
      ansible.builtin.command: date +%Y-%m-%d
      register: current_patch_date
      changed_when: false

    - name: Update last patch date
      become: true
      ansible.builtin.copy:
        content: "{{ current_patch_date.stdout | trim }}\n"
        dest: /etc/lastpatchdate
        owner: root
        group: root
        mode: '0600'

    - name: Buffer telemetry metrics to text file quietly
      run_once: true
      delegate_to: localhost
      changed_when: false
      ansible.builtin.shell: |
        cat << 'EOF' > /tmp/raw_patch_log.tmp
        REPORT_DATA_START
        {% for host in groups['patching_execution_group'] | default([]) %}
        HOST_RECORD:{{ host }}
        OS:{{ hostvars[host]['ansible_distribution'] | default('Unknown') }} {{ hostvars[host]['ansible_distribution_version'] | default('') }}
        OLD_KERNEL:{{ hostvars[host]['baseline_kernel'] | default('Unknown') }}
        NEW_KERNEL:{{ hostvars[host]['ansible_kernel'] | default('Unknown') }}
        UPDATED:{{ 'Yes' if ((hostvars[host]['live_updates_debian']['stdout_lines'] | default([]) | length > 0) or (hostvars[host]['live_updates_redhat']['stdout_lines'] | default([]) | length > 0)) else 'No' }}
        REBOOT:{{ 'Yes' if hostvars[host]['needs_reboot'] | default(false) else 'No' }}
        STATUS:SUCCESS
        PATCHED_PACKAGES_START
        {% if hostvars[host]['live_updates_debian']['stdout_lines'] is defined %}
        {% for line in hostvars[host]['live_updates_debian']['stdout_lines'] %}
        {{ line }}
        {% endfor %}
        {% endif %}
        {% if hostvars[host]['live_updates_redhat']['stdout_lines'] is defined %}
        {% for line in hostvars[host]['live_updates_redhat']['stdout_lines'] %}
        {{ line }}
        {% endfor %}
        {% endif %}
        PATCHED_PACKAGES_END
        HOST_RECORD_END
        {% endfor %}
        REPORT_DATA_END
        EOF
