---
# -----------------------------------------------------------------
# PLAY 1: DYNAMIC INVENTORY SETUP
# -----------------------------------------------------------------
- name: Parse and Map Dynamic Target Scope
  hosts: localhost
  gather_facts: false
  vars:
    target_hosts: ""
  tasks:
    - name: Dynamically append target nodes to runtime environment
      ansible.builtin.add_host:
        name: "{{ item.strip() }}"
        groups: patching_execution_group
      loop: "{{ target_hosts.split(';') }}"
      when: target_hosts.strip() != ""

# -----------------------------------------------------------------
# PLAY 2: ENTERPRISE PATCHING ENGINE & TELEMETRY GENERATION
# -----------------------------------------------------------------
- name: Enterprise Linux Patching and Reporting
  hosts: patching_execution_group
  gather_facts: true
  vars:
    ansible_remote_tmp: "/tmp/ansible_tmp"

  roles:
    - precheck
    - patch     # Executed roles framework layer
    - reboot
    - postcheck

  tasks:
    # ----------------------------------------------------------
    # PRODUCTION FAIL-SAFE: FORCE APPLY HELD-BACK PACKAGES
    # ----------------------------------------------------------
    - name: Force apply outstanding upgradable items (Debian/Ubuntu)
      when: ansible_os_family == "Debian"
      become: true
      ansible.builtin.apt:
        name: "*"
        state: latest
        update_cache: true
        only_upgrade: true
      ignore_errors: true

    - name: Force apply outstanding upgradable items (RedHat/CentOS)
      when: ansible_os_family == "RedHat"
      become: true
      ansible.builtin.dnf:
        name: "*"
        state: latest
        only_upgrade: true
      ignore_errors: true

    # ----------------------------------------------------------
    # POST-PATCH VERIFICATION & CACHE REFRESH
    # ----------------------------------------------------------
    - name: Flush package manager cache and verify updates (Debian/Ubuntu)
      when: ansible_os_family == "Debian"
      become: true
      ansible.builtin.shell: |
        apt-get clean
        apt-get update -qq
        apt list --upgradable 2>/dev/null | tail -n +2 | awk '{print $1, $6, $2}' | sed 's/\\]//g' || true
      register: live_updates_debian
      changed_when: false

    - name: Flush package manager cache and verify updates (RedHat/CentOS)
      when: ansible_os_family == "RedHat"
      become: true
      ansible.builtin.shell: |
        dnf clean all
        dnf check-update -q | grep -E '\\.(x86_64|noarch|i386|aarch64)\\s+' | awk '{print $1, "Installed", $2}' || true
      register: live_updates_redhat
      changed_when: false

    # ----------------------------------------------------------
    # Update last patch date on the TARGET HOST
    # ----------------------------------------------------------
    - name: Get current date from target host
      ansible.builtin.command:
        cmd: date +%Y-%m-%d
      register: current_patch_date
      changed_when: false

    - name: Update last patch date
      become: true
      ansible.builtin.copy:
        content: "{{ current_patch_date.stdout | trim }}\n"
        dest: /etc/lastpatchdate
        owner: root
        group: root
        mode: '0600'

    # ----------------------------------------------------------
    # CONSOLIDATED TELEMETRY GENERATION ENGINE
    # ----------------------------------------------------------
    - name: Display Structured Telemetry Stream
      run_once: true
      delegate_to: localhost
      ansible.builtin.debug:
        msg: |
          REPORT_DATA_START
          {% for host in groups['patching_execution_group'] | default([]) %}
          HOST_RECORD:{{ host }}
          OS:{{ hostvars[host]['ansible_distribution'] | default('Unknown') }} {{ hostvars[host]['ansible_distribution_version'] | default('') }}
          {% set h = hostvars[host]['patch_result'] | default({}) %}
          OLD_KERNEL:{{ h.old_kernel | default('N/A') }}
          NEW_KERNEL:{{ h.new_kernel | default('N/A') }}
          UPDATED:{{ h.updated | default('No') }}
          REBOOT:{{ h.reboot | default('No') }}
          STATUS:{{ h.status | default('FAILED') }}
          PATCHED_PACKAGES_START
          {% if hostvars[host]['live_updates_debian'] is defined and hostvars[host]['live_updates_debian']['stdout_lines'] | length > 0 %}
          {% for line in hostvars[host]['live_updates_debian']['stdout_lines'] %}
          {{ line }}
          {% endfor %}
          {% elif hostvars[host]['live_updates_redhat'] is defined and hostvars[host]['live_updates_redhat']['stdout_lines'] | length > 0 %}
          {% for line in hostvars[host]['live_updates_redhat']['stdout_lines'] %}
          {{ line }}
          {% endfor %}
          {% else %}
          No packages updated.
          {% endif %}
          PATCHED_PACKAGES_END
          HOST_RECORD_END
          {% endfor %}
          REPORT_DATA_END
