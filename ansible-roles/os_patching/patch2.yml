---
# -----------------------------------------------------------------
# PLAY 1: DYNAMIC INVENTORY SETUP
# -----------------------------------------------------------------
- name: Parse and Map Dynamic Target Scope
  hosts: localhost
  gather_facts: false
  vars:
    target_hosts: ""
  tasks:
    - name: Dynamically append target nodes to runtime environment
      ansible.builtin.add_host:
        name: "{{ item.strip() }}"
        groups: patching_execution_group
      loop: "{{ target_hosts.split(';') }}"
      when: target_hosts.strip() != ""

# -----------------------------------------------------------------
# PLAY 2: ENTERPRISE PATCHING ENGINE & TELEMETRY GENERATION
# -----------------------------------------------------------------
- name: Enterprise Linux Patching and Reporting
  hosts: patching_execution_group
  gather_facts: true
  vars:
    ansible_remote_tmp: "/tmp/ansible_tmp"

  roles:
    - precheck
    - patch
    - reboot
    - postcheck

  tasks:
    # ----------------------------------------------------------
    # NATIVE LIVE PACKAGE UPDATE CAPTURE
    # ----------------------------------------------------------
    - name: Capture packages updated today (Debian/Ubuntu)
      when: ansible_os_family == "Debian"
      ansible.builtin.shell: |
        grep -E "$(date +'%Y-%m-%d').*inst" /var/log/dpkg.log | awk '{print $4, $5, $6}' || true
      register: dpkg_updates
      changed_when: false

    - name: Capture packages updated today (RedHat/CentOS)
      when: ansible_os_family == "RedHat"
      ansible.builtin.shell: |
        dnf history info $(dnf history list -q | head -n 1 | awk '{print $1}') | grep -E '^(Alter|Install|Upgrade)' | awk '{print $1, "Installed", "Updated"}' || true
      register: dnf_updates
      changed_when: false

    # ----------------------------------------------------------
    # Update last patch date on the TARGET HOST
    # ----------------------------------------------------------
    - name: Get current date from target host
      ansible.builtin.command:
        cmd: date +%Y-%m-%d
      register: current_patch_date
      changed_when: false

    - name: Update last patch date
      become: true
      ansible.builtin.copy:
        content: "{{ current_patch_date.stdout | trim }}\n"
        dest: /etc/lastpatchdate
        owner: root
        group: root
        mode: '0600'

    # ----------------------------------------------------------
    # CONSOLIDATED TELEMETRY GENERATION ENGINE
    # ----------------------------------------------------------
    - name: Display Structured Telemetry Stream
      run_once: true
      delegate_to: localhost
      ansible.builtin.debug:
        msg: |
          REPORT_DATA_START
          {% for host in groups['patching_execution_group'] | default([]) %}
          HOST_RECORD:{{ host }}
          OS:{{ hostvars[host]['ansible_distribution'] | default('Unknown') }} {{ hostvars[host]['ansible_distribution_version'] | default('') }}
          {% set h = hostvars[host]['patch_result'] | default({}) %}
          OLD_KERNEL:{{ h.old_kernel | default('N/A') }}
          NEW_KERNEL:{{ h.new_kernel | default('N/A') }}
          UPDATED:{{ h.updated | default('No') }}
          REBOOT:{{ h.reboot | default('No') }}
          STATUS:{{ h.status | default('FAILED') }}
          PATCHED_PACKAGES_START
          {% if hostvars[host]['dpkg_updates'] is defined and hostvars[host]['dpkg_updates']['stdout_lines'] | length > 0 %}
          {% for line in hostvars[host]['dpkg_updates']['stdout_lines'] %}
          {{ line }}
          {% endfor %}
          {% elif hostvars[host]['dnf_updates'] is defined and hostvars[host]['dnf_updates']['stdout_lines'] | length > 0 %}
          {% for line in hostvars[host]['dnf_updates']['stdout_lines'] %}
          {{ line }}
          {% endfor %}
          {% else %}
          No packages updated.
          {% endif %}
          PATCHED_PACKAGES_END
          HOST_RECORD_END
          {% endfor %}
          REPORT_DATA_END
