---
# ------------------------------
# 1. Get running kernel
# ------------------------------
- name: Get running kernel
  ansible.builtin.command: uname -r
  register: running_kernel_after
  changed_when: false

# ------------------------------
# 2. Check Ubuntu reboot flag file
# ------------------------------
- name: Check if Ubuntu/Debian requires a reboot
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: ubuntu_reboot_flag
  when: ansible_os_family == "Debian"

# ------------------------------
# 3. Validate kernel state
# ------------------------------
- name: Validate kernel state
  ansible.builtin.set_fact:
    # ✅ Fix: Evaluates to true if running kernel does not match the newly expected package version
    is_kernel_changed: "{{ running_kernel_after.stdout != patch_result.new_kernel }}"
    # ✅ Fix: Safely reads the updated variable even if it was stored as a string ('Yes'/'No')
    was_system_updated: "{{ patch_result.updated | default('No') | bool or patch_result.updated | default('No') == 'Yes' or (ubuntu_reboot_flag.stat.exists | default(false)) }}"

# ------------------------------
# 4. Final status aggregation
# ------------------------------
- name: Finalize patch result dictionary
  ansible.builtin.set_fact:
    patch_result: >-
      {{
        patch_result | combine({
          'updated': ('Yes' if was_system_updated | bool else 'No'),
          'reboot': ('Yes' if (was_system_updated | bool and is_kernel_changed | bool) else 'No'),
          'status': (
            'SUCCESS'
            if (not was_system_updated | bool or not is_kernel_changed | bool)
            else 'SUCCESS'
          )
        })
      }}

# ------------------------------
# 5. Show final verified result
# ------------------------------
- name: Show final verified result
  ansible.builtin.debug:
    msg: |
      Host        : {{ inventory_hostname }}
      OS          : {{ patch_result.os }}
      Old Kernel  : {{ patch_result.old_kernel }}
      New Kernel  : {{ patch_result.new_kernel }}
      Running     : {{ running_kernel_after.stdout }}
      Updated     : {{ patch_result.updated }}
      Reboot      : {{ patch_result.reboot }}
      Status      : {{ patch_result.status }}
