---
# ==========================================================
# PRECHECK - Validation & Self-Healing Kernel Recovery
# Supports: Debian, RedHat, Suse
# ==========================================================

# ------------------------------
# 1. Gather disk usage (Raw MB values)
# ------------------------------
- name: Gather root filesystem space metrics
  ansible.builtin.shell: |
    df -m / | tail -n 1 | awk '{print $4}'
  register: root_free_raw
  changed_when: false

- name: Gather boot filesystem space metrics
  ansible.builtin.shell: |
    df -m /boot | tail -n 1 | awk '{print $4}'
  register: boot_free_raw
  changed_when: false

- name: Identify boot partition layout structure
  ansible.builtin.shell: |
    [ "$(df / | tail -n 1 | awk '{print $1}')" != "$(df /boot | tail -n 1 | awk '{print $1}')" ] && echo "true" || echo "false"
  register: boot_partition_check
  changed_when: false

- name: Map space variables to memory facts
  ansible.builtin.set_fact:
    root_free_mb: "{{ root_free_raw.stdout | trim | int }}"
    boot_free_mb: "{{ boot_free_raw.stdout | trim | int }}"
    is_boot_separate: "{{ boot_partition_check.stdout | trim | bool }}"

# ------------------------------
# 2. Automated Old Kernel Purge (Proactive Triage)
# ------------------------------
- name: Proactive old kernel purge loop
  become: true
  when: 
    - ansible_os_family == "Debian"
    - is_boot_separate
    - (boot_free_mb | int) < 150
  block:
    - name: Inventory installed linux kernel elements safely
      ansible.builtin.shell: |
        set -o pipefail
        dpkg --get-selections | grep -E '^linux-(image|headers|modules|tools|modules-extra)-[0-9]' | awk '{print $1}' | sort -r || true
      register: installed_kernel_packages
      changed_when: false

    - name: Parse protection boundaries for the active kernel
      ansible.builtin.set_fact:
        kernels_to_purge: >-
          {%- set purge_list = [] -%}
          {%- for pkg in installed_kernel_packages.stdout_lines | default([]) -%}
            {%- if ansible_kernel not in pkg and "6.8.0-149" not in pkg -%}
              {%- set _ = purge_list.append(pkg) -%}
            {%- endif -%}
          {%- endfor -%}
          {{ purge_list }}

    - name: Purge historical packages via dpkg directly
      ansible.builtin.command: "dpkg --purge {{ item }}"
      loop: "{{ kernels_to_purge }}"
      when: kernels_to_purge | length > 0
      ignore_errors: true
      loop_control:
        label: "{{ item }}"

# ------------------------------
# 3. Enforce Storage Allocation Boundaries
# ------------------------------
- name: Validate root free space capacity
  ansible.builtin.fail:
    msg: "Root filesystem space insufficient. Required: 5GB."
  when: (root_free_mb | int) < 5120

# ------------------------------
# 4. Self-Healing Package Manager Dependency Repair Block
# ------------------------------
- name: Execute package engine self-healing recovery loop
  when: ansible_os_family == "Debian"
  block:
    - name: Fix broken package dependencies
      become: true
      ansible.builtin.command: apt-get -f install -y
      register: first_repair_attempt
      ignore_errors: true

    # IF STUCK IN A WRITE ERROR LOCK-OUT CONTAINER, TRIGGER MANUAL EMERGENCY CLEANUP
    - name: Emergency manual cleanup block for frozen boot mounts
      become: true
      when: first_repair_attempt.rc is defined and first_repair_attempt.rc != 0
      block:
        - name: Erase conflicting static files directly from /boot mount space
          ansible.builtin.shell: |
            find /boot -name "*6.8.0-13*" -delete || true
            find /boot -name "*6.8.0-146*" -delete || true

        - name: Clear locks and trigger native low-level configuration recovery
          ansible.builtin.command: dpkg --configure -a

        - name: Confirm transaction settlement via apt-get engine
          ansible.builtin.command: apt-get -f install -y

# ------------------------------
# 5. Metadata Index Sync Updates
# ------------------------------
- name: Update apt cache index
  ansible.builtin.apt:
    update_cache: true
  when: ansible_os_family == "Debian"

- name: Refresh DNF metadata
  ansible.builtin.dnf:
    update_cache: true
  when: ansible_os_family == "RedHat"

- name: Refresh zypper repositories
  ansible.builtin.command: zypper --gpg-auto-import-keys refresh
  changed_when: false
  when: ansible_os_family == "Suse"

# ------------------------------
# 6. Establish Dynamic Target Metrics
# ------------------------------
- name: Ensure baseline system layout configuration tracking elements are ready
  ansible.builtin.package:
    name: "{{ 'linux-generic' if ansible_distribution == 'Ubuntu' else 'kernel' if ansible_os_family == 'RedHat' else 'kernel-default' }}"
    state: present
  ignore_errors: true

- name: Capture running kernel baseline properties
  ansible.builtin.set_fact:
    running_kernel: "{{ ansible_kernel }}"
    precheck_result:
      host: "{{ inventory_hostname }}"
      os: "{{ ansible_distribution }} {{ ansible_distribution_version }}"
      kernel_before: "{{ ansible_kernel }}"
