---
# ==========================================================
# PRECHECK - Validation & Self-Healing Kernel Recovery
# Supports: Debian, RedHat, Suse
# ==========================================================

# ----------------------------------------------------------
# 1. Break Stuck Package Manager Frontend Locks
# ----------------------------------------------------------
- name: Force clear stuck apt/dpkg process locks defensively
  when: ansible_os_family == "Debian"
  become: true
  block:
    - name: Kill background apt/dpkg processes holding locks
      ansible.builtin.shell: |
        pidof apt apt-get dpkg | xargs kill -9 2>/dev/null || true
      changed_when: false

    - name: Remove stale lock files to prevent system deadlocks
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /var/lib/dpkg/lock
        - /var/lib/dpkg/lock-frontend
        - /var/lib/apt/lists/lock
        - /var/cache/apt/archives/lock

# ----------------------------------------------------------
# 2. Gather Real-Time Disk Space Metrics Natively
# ----------------------------------------------------------
- name: Gather root filesystem space metrics
  ansible.builtin.shell: df -m / | tail -n 1 | awk '{print $4}'
  register: root_free_raw
  changed_when: false

- name: Gather boot filesystem space metrics
  ansible.builtin.shell: df -m /boot | tail -n 1 | awk '{print $4}'
  register: boot_free_raw
  changed_when: false

- name: Identify boot partition layout structure
  ansible.builtin.shell: |
    [ "$(df / | tail -n 1 | awk '{print $1}')" != "$(df /boot | tail -n 1 | awk '{print $1}')" ] && echo "true" || echo "false"
  register: boot_partition_check
  changed_when: false

- name: Map space variables to memory facts
  ansible.builtin.set_fact:
    root_free_mb: "{{ root_free_raw.stdout | trim | int }}"
    boot_free_mb: "{{ boot_free_raw.stdout | trim | int }}"
    is_boot_separate: "{{ boot_partition_check.stdout | trim | bool }}"

# ----------------------------------------------------------
# 3. Dynamic Kernel Purge (No Hardcoding)
# Keeps only the current running kernel and the immediate previous kernel
# ----------------------------------------------------------
- name: Triage and execute dynamic old kernel purge
  become: true
  when: 
    - ansible_os_family == "Debian"
    - is_boot_separate
    - (boot_free_mb | int) < 150
  block:
    - name: Calculate which historical packages to purge dynamically
      ansible.builtin.shell: |
        all_vers=$(dpkg-query -W -f='${Package}\n' 'linux-image-[0-9]*' 2>/dev/null | sed -E 's/linux-image-unsigned-//g' | sed -E 's/linux-image-//g' | sort -V | uniq)
        running_ver=$(uname -r | sed 's/-generic//g')
        prev_ver=$(echo "$all_vers" | grep -B 1 -F "$running_ver" | head -n 1)
        
        dpkg --get-selections | grep -E '^linux-(image|headers|modules|tools|modules-extra)-[0-9]' | awk '{print $1}' | while read -r pkg; do
            if [[ "$pkg" != *"$running_ver"* && "$pkg" != *"$prev_ver"* ]]; then
                echo "$pkg"
            fi
        done | sort -r
      register: calculated_kernels_to_purge
      changed_when: false

    - name: Purge historical packages via grouped dpkg line execution
      ansible.builtin.command: "dpkg --purge {{ calculated_kernels_to_purge.stdout_lines | join(' ') }}"
      when: calculated_kernels_to_purge.stdout_lines | length > 0
      ignore_errors: true

# ----------------------------------------------------------
# 4. Enforce Storage Allocation Boundaries
# ----------------------------------------------------------
- name: Validate root free space capacity
  ansible.builtin.fail:
    msg: "Root filesystem space insufficient. Required: 5GB."
  when: (root_free_mb | int) < 5120

# ----------------------------------------------------------
# 5. Self-Healing Package Manager Dependency Repair Block
# ----------------------------------------------------------
- name: Execute package engine self-healing recovery loop
  when: ansible_os_family == "Debian"
  block:
    - name: Trigger native low-level configuration recovery
      become: true
      ansible.builtin.command: dpkg --configure -a
      register: initial_configure_attempt
      ignore_errors: true

    - name: Fix broken package dependencies
      become: true
      ansible.builtin.command: apt-get -f install -y
      register: first_repair_attempt
      ignore_errors: true

    # CRITICAL RESCUE HANDLER FOR THE CURRENT CIRCULAR SPACE LOCK
    - name: Emergency manual cleanup block for frozen boot mounts
      become: true
      when: (initial_configure_attempt.rc is defined and initial_configure_attempt.rc != 0) or (first_repair_attempt.rc is defined and first_repair_attempt.rc != 0)
      block:
        - name: Free space manually by deleting older conflicting initrd assets safely
          ansible.builtin.shell: |
            running_ver=$(uname -r | sed 's/-generic//g')
            # Deletes older initrd files but keeps the running kernel completely safe
            find /boot -type f -name "*initrd*" ! -name "*$running_ver*" -delete || true
            find /boot -type f -name "*vmlinuz*" ! -name "*$running_ver*" -delete || true
          changed_when: true

        - name: Re-run low-level configuration recovery with newly recovered space
          ansible.builtin.command: dpkg --configure -a

        - name: Confirm transaction settlement via apt-get engine
          ansible.builtin.command: apt-get -f install -y

# ----------------------------------------------------------
# 6. Metadata Index Sync Updates
# ----------------------------------------------------------
- name: Update apt cache index
  ansible.builtin.apt:
    update_cache: true
  when: ansible_os_family == "Debian"

- name: Refresh DNF metadata
  ansible.builtin.dnf:
    update_cache: true
  when: ansible_os_family == "RedHat"

- name: Refresh zypper repositories
  ansible.builtin.command: zypper --gpg-auto-import-keys refresh
  changed_when: false
  when: ansible_os_family == "Suse"

# ----------------------------------------------------------
# 7. Establish Dynamic Target Metrics
# ----------------------------------------------------------
- name: Ensure baseline system layout configuration tracking elements are ready
  ansible.builtin.package:
    name: "{{ 'linux-generic' if ansible_distribution == 'Ubuntu' else 'kernel' if ansible_os_family == 'RedHat' else 'kernel-default' }}"
    state: present
  ignore_errors: true

- name: Capture running kernel baseline properties
  ansible.builtin.set_fact:
    running_kernel: "{{ ansible_kernel }}"
    precheck_result:
      host: "{{ inventory_hostname }}"
      os: "{{ ansible_distribution }} {{ ansible_distribution_version }}"
      kernel_before: "{{ ansible_kernel }}"
