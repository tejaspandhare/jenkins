---
# ==========================================================
# PRECHECK - Common Linux Validation & Self-Healing
# Supports: Debian, RedHat, Suse
# ==========================================================

# ------------------------------
# 1. Gather disk usage
# ------------------------------
- name: Gather root filesystem usage
  ansible.builtin.command: df -m /
  register: root_usage
  changed_when: false
  failed_when: false

- name: Gather boot filesystem usage
  ansible.builtin.command: df -m /boot
  register: boot_usage
  changed_when: false
  failed_when: false

# ------------------------------
# 2. Parse free space metrics (in Megabytes)
# ------------------------------
- name: Parse root free space MB
  ansible.builtin.set_fact:
    root_free_mb: "{{ root_usage.stdout_lines[1].split()[3] | int }}"
  when: root_usage.rc == 0 and (root_usage.stdout_lines | length) > 1

- name: Parse boot free space MB
  ansible.builtin.set_fact:
    boot_free_mb: "{{ boot_usage.stdout_lines[1].split()[3] | int }}"
  when: boot_usage.rc == 0 and (boot_usage.stdout_lines | length) > 1

- name: Check if /boot is a separate partition
  ansible.builtin.set_fact:
    is_boot_separate: "{{ root_usage.stdout_lines[1].split()[0] != boot_usage.stdout_lines[1].split()[0] }}"
  when: root_usage.rc == 0 and boot_usage.rc == 0 and (root_usage.stdout_lines | length) > 1 and (boot_usage.stdout_lines | length) > 1

# ------------------------------
# 3. Automated Old Kernel Purge (Self-Healing)
# Forces execution if space is under 150MB to free up the apt lock
# ------------------------------
- name: Clear older unapplied kernels if space is limited
  become: true
  when:
    - ansible_os_family == "Debian"
    - is_boot_separate | default(false) | bool
    - (boot_free_mb | default(0) | int) < 150
  block:
    - name: Fetch inventory of installed kernel image modules
      ansible.builtin.shell: |
        set -o pipefail
        dpkg --get-selections | grep -E '^linux-(image|modules)-[0-9]' | awk '{print $1}'
      register: installed_kernel_packages
      changed_when: false

    - name: Filter out active running kernel from purge list
      ansible.builtin.set_fact:
        kernels_to_purge: >-
          {%- set purge_list = [] -%}
          {%- for pkg in installed_kernel_packages.stdout_lines | default([]) -%}
            {%- if ansible_kernel not in pkg -%}
              {%- set _ = purge_list.append(pkg) -%}
            {%- endif -%}
          {%- endfor -%}$
          {{ purge_list }}

    # Uses dpkg directly because apt-get is currently locked by the system
    - name: Purge historical kernel packages directly via dpkg
      ansible.builtin.command: "dpkg --purge {{ item }}"
      loop: "{{ kernels_to_purge }}"
      when: kernels_to_purge | length > 0
      ignore_errors: true
      loop_control:
        label: "{{ item }}"

    # Recalculate space metrics after purging completes
    - name: Refresh boot partition metrics post-cleanup
      ansible.builtin.command: df -m /boot
      register: boot_usage_post
      changed_when: false

    - name: Reparse updated boot free space MB
      ansible.builtin.set_fact:
        boot_free_mb: "{{ boot_usage_post.stdout_lines[1].split()[3] | int }}"
      when: boot_usage_post.rc == 0 and (boot_usage_post.stdout_lines | length) > 1

# ------------------------------
# 4. Enforce Space Bounds Post-Cleanup
# ------------------------------
- name: Validate root free space
  ansible.builtin.fail:
    msg: "Root filesystem has only {{ (root_free_mb|int / 1024)|round(1) }}GB free. Minimum required is 5GB."
  when: (root_free_mb | default(0) | int) < 5120

- name: Validate boot free space
  ansible.builtin.fail:
    msg: "/boot partition has only {{ boot_free_mb | default('unknown') }}MB free. Minimum required is 150MB."
  when:
    - boot_free_mb is defined
    - (is_boot_separate | default(false) | bool)
    - (boot_free_mb | int) < 150

# ------------------------------
# 5. Fix package issues
# ------------------------------
- name: Fix broken dependencies (Debian/Ubuntu)
  ansible.builtin.command: apt-get -f install -y
  register: fix_broken
  changed_when: "'0 upgraded' not in (fix_broken.stdout | default(''))"
  when: ansible_os_family == "Debian"

# ------------------------------
# 6. Refresh package metadata
# ------------------------------
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
  when: ansible_os_family == "Debian"

- name: Refresh DNF metadata
  ansible.builtin.dnf:
    update_cache: true
  when: ansible_os_family == "RedHat"

- name: Refresh zypper repositories
  ansible.builtin.command: zypper --gpg-auto-import-keys refresh
  changed_when: false
  when: ansible_os_family == "Suse"

# ------------------------------
# 7. Ensure kernel tracking package exists
# ------------------------------
- name: Ensure Ubuntu kernel meta-package exists
  ansible.builtin.apt:
    name: linux-generic
    state: present
  when: ansible_distribution == "Ubuntu"

- name: Ensure kernel package is present (RHEL)
  ansible.builtin.package:
    name: kernel
    state: present
  when: ansible_os_family == "RedHat"

- name: Ensure kernel-default package is present (SUSE)
  ansible.builtin.package:
    name: kernel-default
    state: present
  when: ansible_os_family == "Suse"

# ------------------------------
# 8. Capture baseline kernel
# ------------------------------
- name: Capture running kernel baseline
  ansible.builtin.set_fact:
    running_kernel: "{{ ansible_kernel }}"

# ------------------------------
# 9. Capture installed kernels
# ------------------------------
- name: Get installed kernels (Debian)
  ansible.builtin.shell: |
    dpkg -l 'linux-image-*' 2>/dev/null | awk '/^ii/ {print $2}'
  args:
    executable: /bin/bash
  register: installed_kernels
  changed_when: false
  failed_when: false
  when: ansible_os_family == "Debian"

- name: Get installed kernels (RedHat)
  ansible.builtin.command: rpm -q kernel
  register: installed_kernels
  changed_when: false
  failed_when: false
  when: ansible_os_family == "RedHat"

- name: Get installed kernels (SUSE)
  ansible.builtin.command: rpm -q kernel-default
  register: installed_kernels
  changed_when: false
  failed_when: false
  when: ansible_os_family == "Suse"

# ------------------------------
# 10. Store baseline facts
# ------------------------------
- name: Store precheck baseline
  ansible.builtin.set_fact:
    precheck_result:
      host: "{{ inventory_hostname }}"
      os: "{{ ansible_distribution }} {{ ansible_distribution_version }}"
      kernel_before: "{{ ansible_kernel }}"

# ------------------------------
# 11. Precheck summary
# ------------------------------
- name: Show precheck summary
  ansible.builtin.debug:
    msg: |
      Precheck completed on {{ inventory_hostname }}

      OS             : {{ ansible_distribution }} {{ ansible_distribution_version }}
      Running Kernel : {{ running_kernel }}
      Root Free      : {{ (root_free_mb|int / 1024)|round(1) }}GB
      Boot Free      : {{ boot_free_mb | default('Shared') }}MB

      Installed Kernels:
      {{ installed_kernels.stdout | default('Not detected') }}
