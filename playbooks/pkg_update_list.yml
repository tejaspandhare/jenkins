---
# -----------------------------------------------------------------
# PHASE 1: DYNAMIC INVENTORY INJECTION (Handles unmanaged inputs)
# -----------------------------------------------------------------
- name: Initialize Target Host Environment
  hosts: localhost
  gather_facts: false
  vars:
    hosts_param: ""
  tasks:
    - name: Dynamically parse and add target servers to inventory
      add_host:
        name: "{{ item.strip() }}"
        groups: dynamic_target_group
      loop: "{{ hosts_param.split(';') }}"
      when: hosts_param.strip() != ""

# -----------------------------------------------------------------
# PHASE 2: RUN ARCHITECTURE AUDITS AGAINST TARGET NODES
# -----------------------------------------------------------------
- name: Global OS Update Auditor
  hosts: dynamic_target_group
  gather_facts: false

  tasks:
    # 0. Fetch metadata properties dynamically
    - name: Dynamically gather system layout facts for target nodes
      setup:
        gather_subset:
          - 'distribution'
          - 'system'
      ignore_errors: true

    # --- DEBIAN / UBUNTU FLAVORS ---
    - name: Check Debian/Ubuntu Updates
      when: ansible_os_family | default('') == "Debian"
      become: true
      block:
        - name: Query APT Upgradable Packages
          shell: "apt list --upgradable 2>/dev/null | tail -n +2"
          register: apt_out
          changed_when: false

        - name: Format APT output
          set_fact:
            package_report: |
              {% if apt_out.stdout_lines | length > 0 %}
              Package name                   Current version           Target version           
              --------------------------------------------------------------------------------
              {% for line in apt_out.stdout_lines %}
              {% set parts = line.split() %}
              {% set pkg = parts[0].split('/') %}
              {% set target = parts[1] %}
              {% set current = 'Unknown' %}
              {% if 'from:' in line %}
                {% set idx = parts.index('from:') %}
                {% set current = parts[idx+1] | replace(']', '') %}
              {% endif %}
              {{ "    %-30s %-25s %-25s" | format(pkg[0], current, target) }}
              {% endfor %}
              {% else %}
                  System is up to date.
              {% endif %}
            update_count: "{{ apt_out.stdout_lines | length }}"
            node_status: "SUCCESS"

    # --- REDHAT / CENTOS / FEDORA / AMAZON LINUX FLAVORS ---
    - name: Check RedHat Updates
      when: ansible_os_family | default('') == "RedHat"
      become: true
      block:
        - name: Query DNF/YUM Upgradable Packages
          shell: "dnf check-update -q || yum check-update -q"
          register: dnf_raw
          failed_when: dnf_raw.rc not in [0, 100]
          changed_when: false

        - name: Filter and Format DNF Output
          set_fact:
            cleaned_lines: "{{ dnf_raw.stdout_lines | select('match', '^\\S+\\.\\S+\\s+\\S+') | reject('search', 'Obsoleting Packages') | list }}"

        - name: Generate RedHat Report Block
          set_fact:
            package_report: |
              {% if cleaned_lines | length > 0 %}
              Package name                   Current version           Target version           
              --------------------------------------------------------------------------------
              {% for line in cleaned_lines %}
              {% set parts = line.split() %}
              {{ "    %-30s %-25s %-25s" | format(parts[0], 'Installed', parts[1]) }}
              {% endfor %}
              {% else %}
                  System is up to date.
              {% endif %}
            update_count: "{{ cleaned_lines | length }}"
            node_status: "SUCCESS"

    # --- SUSE / OPENSUSE FLAVORS ---
    - name: Check Suse Updates
      when: ansible_os_family | default('') == "Suse"
      become: true
      block:
        - name: Query Zypper Upgradable Packages
          shell: "zypper --non-interactive list-updates -g 2>/dev/null | tail -n +5"
          register: suse_out
          changed_when: false

        - name: Format Zypper Output
          set_fact:
            package_report: |
              {% if suse_out.stdout_lines | length > 0 %}
              Package name                   Current version           Target version           
              --------------------------------------------------------------------------------
              {% for line in suse_out.stdout_lines %}
              {% set parts = line.split('|') %}
              {% if parts | length >= 5 %}
              {{ "    %-30s %-25s %-25s" | format(parts[2]|trim, parts[3]|trim, parts[4]|trim) }}
              {% endif %}
              {% endfor %}
              {% else %}
                  System is up to date.
              {% endif %}
            update_count: "{{ suse_out.stdout_lines | length }}"
            node_status: "SUCCESS"

# -----------------------------------------------------------------
# PHASE 3: CONSOLIDATE DATA PATTERNS AND PRINT METRIC LOGS
# -----------------------------------------------------------------
- name: Output Clean Data Collection
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Display Text Engine Output
      debug:
        msg: |
          REPORT_JSON_DATA_START
          {% for host in groups['dynamic_target_group'] | default([]) %}
          SERVER_RECORD:{{ host }}
          HOSTNAME:{{ hostvars[host]['ansible_fqdn'] | default(hostvars[host]['ansible_hostname']) | default(host) }}
          OS:{{ hostvars[host]['ansible_distribution'] | default('Unknown') }} {{ hostvars[host]['ansible_distribution_version'] | default('') }}
          COUNT:{{ hostvars[host]['update_count'] | default('0') }}
          STATUS:{{ hostvars[host]['node_status'] | default('FAILED') }}
          DETAILS_START
          {{ hostvars[host]['package_report'] | default('   Reason: Unreachable via SSH or patch dry-run execution failed.\n') }}
          DETAILS_END
          {% endfor %}
          REPORT_JSON_DATA_END
