---
- name: Global OS Update Auditor
  hosts: hosts: "{{ hosts.split(';') }}"
  gather_facts: true
  become: true
  vars:
    report_path: "{{ playbook_dir }}/os_update_report.txt"

  tasks:
    # -------------------------------------------------------------
    # 1. INITIALIZE BLANK REPORT ON CONTROLLER
    # -------------------------------------------------------------
    - name: Initialize Report Header on Master
      run_once: true
      delegate_to: localhost
      become: false
      copy:
        dest: "{{ report_path }}"
        content: |
          GLOBAL OS UPDATE REPORT
          Generated on: {{ lookup('pipe', 'date') }}
          ============================================================

    # -------------------------------------------------------------
    # 2. RUN PACKAGE MANAGER DRY RUNS BASED ON DISTRO
    # -------------------------------------------------------------
    
    # --- DEBIAN / UBUNTU FLAVORS ---
    - name: Check Debian/Ubuntu Updates
      when: ansible_os_family == "Debian"
      block:
        - name: Refresh APT cache
          apt:
            update_cache: true
            cache_valid_time: 0
          ignore_errors: true

        - name: Query APT Upgradable Packages
          shell: "apt list --upgradable 2>/dev/null | tail -n +2"
          register: apt_out
          changed_when: false

        - name: Format APT output
          set_fact:
            package_report: |
              {% if apt_out.stdout_lines | length > 0 %}
              Package name                   Current version           Target version           
              --------------------------------------------------------------------------------
              {% for line in apt_out.stdout_lines %}
              {% set parts = line.split() %}
              {% set pkg = parts[0].split('/') %}
              {% set target = parts[1] %}
              {% set current = 'Unknown' %}
              {% if 'from:' in line %}
                {% set idx = parts.index('from:') %}
                {% set current = parts[idx+1] | replace(']', '') %}
              {% endif %}
              {{ "%-30s %-25s %-25s" | format(pkg[0], current, target) }}
              {% endfor %}
              {% else %}
              System is up to date.
              {% endif %}
            update_count: "{{ apt_out.stdout_lines | length }}"

    # --- REDHAT / CENTOS / FEDORA / AMAZON LINUX FLAVORS ---
    - name: Check RedHat Updates
      when: ansible_os_family == "RedHat"
      block:
        - name: Query DNF/YUM Upgradable Packages
          shell: "dnf check-update -q || yum check-update -q"
          register: dnf_raw
          failed_when: dnf_raw.rc not in [0, 100]
          changed_when: false

        # Clean up lines securely without broken regex filters
        - name: Filter and Format DNF Output
          set_fact:
            cleaned_lines: "{{ dnf_raw.stdout_lines | select('match', '^\\S+\\.\\S+\\s+\\S+') | reject('search', 'Obsoleting Packages') | list }}"

        - name: Generate RedHat Report Block
          set_fact:
            package_report: |
              {% if cleaned_lines | length > 0 %}
              Package name                   Current version           Target version           
              --------------------------------------------------------------------------------
              {% for line in cleaned_lines %}
              {% set parts = line.split() %}
              {{ "%-30s %-25s %-25s" | format(parts[0], 'Installed', parts[1]) }}
              {% endfor %}
              {% else %}
              System is up to date.
              {% endif %}
            update_count: "{{ cleaned_lines | length }}"

    # --- SUSE / OPENSUSE FLAVORS ---
    - name: Check Suse Updates
      when: ansible_os_family == "Suse"
      block:
        - name: Refresh Zypper Repos
          zypper_repository:
            repo: '*'
            run_refresh: true
          ignore_errors: true

        - name: Query Zypper Upgradable Packages
          shell: "zypper --non-interactive list-updates -g 2>/dev/null | tail -n +5"
          register: suse_out
          changed_when: false

        - name: Format Zypper Output
          set_fact:
            package_report: |
              {% if suse_out.stdout_lines | length > 0 %}
              Package name                   Current version           Target version           
              --------------------------------------------------------------------------------
              {% for line in suse_out.stdout_lines %}
              {% set parts = line.split('|') %}
              {% if parts | length >= 5 %}
              {{ "%-30s %-25s %-25s" | format(parts[2]|trim, parts[3]|trim, parts[4]|trim) }}
              {% endif %}
              {% endfor %}
              {% else %}
              System is up to date.
              {% endif %}
            update_count: "{{ suse_out.stdout_lines | length }}"

    # -------------------------------------------------------------
    # 3. CONSOLIDATE RESULTS AND APPEND TO CONTROLLER REPORT
    # -------------------------------------------------------------
    - name: Append Node Metadata to Master Report
      delegate_to: localhost
      become: false
      lineinfile:
        path: "{{ report_path }}"
        insertafter: EOF
        line: |
          Server name: {{ inventory_hostname }}
          ============================================================
          Server hostname: {{ ansible_fqdn | default(ansible_hostname) }}
          Server OS: {{ ansible_distribution }} {{ ansible_distribution_version }}
          Number of updates available: {{ update_count | default('0') }}

          {{ package_report | default('System is up to date.\n') }}
          Status: SUCCESS
          

# -----------------------------------------------------------------
# 4. CAPTURE UNREACHABLE / FAILED NODES
# -----------------------------------------------------------------
- name: Handle Failure Audits
  hosts: "{{ hosts | default('all') }}"
  gather_facts: false
  tasks:
    - name: Record Offline Host Details
      run_once: true
      delegate_to: localhost
      become: false
      lineinfile:
        path: "{{ playbook_dir }}/os_update_report.txt"
        insertafter: EOF
        line: |
          {% for host in groups['all'] %}
          {% if hostvars[host]['update_count'] is undefined %}
          Server name: {{ host }}
          ============================================================
          Status: FAILED
          Reason: Unreachable via SSH or framework setup error.
          

          {% endif %}
          {% endfor %}
